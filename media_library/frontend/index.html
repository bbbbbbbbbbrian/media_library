<!DOCTYPE html>
<html>
<head>
    <title>Media Vault</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Media Library</h1>

    <h2>Add a Reading</h2>

    <form id="add-form">
        <input
            type="text"
            id="url-input"
            placeholder="Paste chapter URL"
        >
        <button type="submit">Add</button>
    </form>

    <h2>My Reading List</h2>

    <div id="reading-list"></div>

    <script src="app.js"></script>
</body>
</html>
